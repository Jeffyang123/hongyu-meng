lab_intro:
  desc_zh: 课题组依托智能院在类脑计算、类脑芯片及大规模神经网络方面的平台优势，聚焦预测编码的神经科学机制与类脑智能应用研究，以“解析大脑预测与误差计算机制，推动高效类脑智能算法落地”为核心目标。
  desc_en: Relying on the platforms of GIIST in neuromorphic computing, brain-inspired chips, and large-scale neural networks, the lab focuses on the neural mechanisms of predictive coding and brain-inspired intelligence applications, with the core goal of "decoding the brain's predictive and error-computing mechanisms to advance efficient brain-inspired AI".
